name: Android AAB Build

on:
  pull_request:
    branches: [ main ]

jobs:
  build-aab:
    runs-on: ubuntu-latest
    env:
      JAVA_HOME: /usr/lib/jvm/adoptopenjdk-11-hotspot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Android SDK packages
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          build-tools: '35.0.0'

      - name: Make CI script executable
        run: chmod +x ci_scripts/check-android-sdk-35.sh

      - name: Run SDK check script
        run: ./ci_scripts/check-android-sdk-35.sh

      - name: Build AAB
        working-directory: android
        run: ./gradlew clean bundleRelease --no-daemon --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
